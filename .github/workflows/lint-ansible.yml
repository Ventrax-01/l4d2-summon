name: lint ansible

# Solo cuando cambia el Ansible: en un monorepo cada pieza tiene su propio pipeline.
on:
  push:
    paths:
      - 'ansible/**'
      - '.github/workflows/lint-ansible.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/lint-ansible.yml'

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ansible/ansible-lint@main
        with:
          working_directory: ansible
