---
- name: Fail early when the agent token is missing
  ansible.builtin.assert:
    that: summon_token | length > 0
    fail_msg: >-
      summon_token está vacío. Ponlo en group_vars/all.yml (gitignorado); el valor está en
      el Parameter Store, en /l4d2-summon/agent-token. Sin él el agente arranca y la nube
      le devuelve 401 en cada latido.

# El plugin se compila en el host desde su fuente, no se envía compilado: un .smx en el repo
# se queda viejo en cuanto alguien toca el .sp, y nada avisa de que dejaron de coincidir.
- name: Install the summon admin plugin source
  ansible.builtin.copy:
    src: scripting/summon_admin.sp
    dest: "{{ install_dir }}/left4dead2/addons/sourcemod/scripting/summon_admin.sp"
    owner: "{{ steam_user }}"
    group: "{{ steam_user }}"
    mode: "0644"
  register: fuente_plugin

- name: Check whether the summon admin plugin is already built
  ansible.builtin.stat:
    path: "{{ install_dir }}/left4dead2/addons/sourcemod/plugins/summon_admin.smx"
  register: summon_smx

- name: Compile the summon admin plugin
  ansible.builtin.command:
    cmd: >-
      {{ spcomp_dir }}/sourcemod/spcomp
      -i{{ spcomp_dir }}/include
      -i{{ spcomp_dir }}/sourcemod/include
      {{ install_dir }}/left4dead2/addons/sourcemod/scripting/summon_admin.sp
      -o{{ install_dir }}/left4dead2/addons/sourcemod/plugins/summon_admin.smx
  become: true
  become_user: "{{ steam_user }}"
  # Se compila cuando cambia la fuente O cuando falta el artefacto. Condicionarlo solo al
  # cambio dejaba el plugin sin construir para siempre si la primera vez falló: la fuente ya
  # coincidía, la tarea se saltaba y el playbook terminaba en verde sin el plugin — y sin él,
  # quien reserva nunca recibe el mando de su servidor.
  when: fuente_plugin is changed or not summon_smx.stat.exists
  changed_when: true

- name: Install the summon matchmode plugin list
  ansible.builtin.copy:
    src: summon_plugins.cfg
    dest: "{{ install_dir }}/left4dead2/cfg/cfgogl/summon_plugins.cfg"
    owner: "{{ steam_user }}"
    group: "{{ steam_user }}"
    mode: "0644"

- name: Ask confogl to load the admin plugin when a match starts
  ansible.builtin.lineinfile:
    path: "{{ install_dir }}/left4dead2/cfg/cfgogl/zonemod/zonemod.cfg"
    line: "exec cfgogl/summon_plugins.cfg"
    insertafter: EOF
    owner: "{{ steam_user }}"
    group: "{{ steam_user }}"

- name: Deploy the agent
  ansible.builtin.copy:
    src: summon_agent.py
    dest: /opt/l4d2-fleet/summon_agent.py
    owner: root
    group: root
    mode: "0755"
  notify: restart summon-agent

# 0600 y de root: lleva el token que autentica a esta máquina ante la nube. Quien lo lea
# puede hacerse pasar por la flota entera.
- name: Write the agent environment
  ansible.builtin.template:
    src: summon-agent.env.j2
    dest: /etc/l4d2-fleet/summon-agent.env
    owner: root
    group: root
    mode: "0600"
  notify: restart summon-agent

- name: Install the agent service
  ansible.builtin.template:
    src: summon-agent.service.j2
    dest: /etc/systemd/system/summon-agent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart summon-agent

- name: Enable and start the agent
  ansible.builtin.systemd:
    name: summon-agent
    enabled: true
    state: restarted
    daemon_reload: true

# El módulo de systemd da la tarea por buena en cuanto systemd acepta el arranque, no cuando
# el proceso sobrevive. Con Restart=always, un agente que muere al segundo entra en un bucle
# de reinicios y la tarea seguiría en verde. Eso importa mucho aquí: el paso siguiente quita
# los servidores del arranque, así que un despliegue "correcto" con el agente muerto deja la
# máquina sin nadie que levante nada y sin nadie que la apague.
- name: Give the agent a moment to prove it stays up
  ansible.builtin.pause:
    seconds: 12

- name: Verify the agent is actually running
  ansible.builtin.command: systemctl is-active summon-agent
  register: agente_vivo
  changed_when: false
  failed_when: agente_vivo.stdout.strip() != "active"

- name: Verify the agent is talking to the cloud
  ansible.builtin.command: journalctl -u summon-agent -n 40 --no-pager
  register: agente_log
  changed_when: false
  failed_when: >-
    'la nube rechazó el latido' in agente_log.stdout
    or 'no se pudo hablar con la nube' in agente_log.stdout

# Los servidores no arrancan solos al encender: es el agente quien los levanta cuando alguien
# reserva. Dejarlos habilitados haría que la máquina despertara con los cuatro corriendo y
# nunca se apagaría, porque siempre habría algo en marcha.
- name: Stop the fleet from starting on boot
  ansible.builtin.systemd:
    name: "l4d2@{{ item }}"
    enabled: false
  loop: "{{ range(1, server_count | int + 1) | list }}"

# Y se paran los que quedaron corriendo del despliegue de la flota. Si no, el sistema arranca
# desde un estado que no contempla: cuatro servidores en marcha que nadie reservó, ocupando
# los slots y estorbando a la primera prueba de apagado.
- name: Stop servers nobody reserved
  ansible.builtin.systemd:
    name: "l4d2@{{ item }}"
    state: stopped
  loop: "{{ range(1, server_count | int + 1) | list }}"
  when: stop_unreserved_servers | bool
