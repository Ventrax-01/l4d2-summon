---
# Por qué SourceBans y no los bans que trae SourceMod: `basebans` guarda los baneos en
# `banned_user.cfg`, un fichero del install. Los cuatro servidores comparten ese install, así
# que se pisan entre ellos, y srcds solo lo escribe cuando alguien llama a `writeid` — un
# reinicio se lleva por delante lo que no se hubiera volcado. Con la base de datos el baneo
# es uno solo, compartido por la flota, y sobrevive a los reinicios.

- name: Fail early when the database password is missing
  ansible.builtin.assert:
    that:
      - sourcebans_db_pass | length >= 16
      - sourcebans_db_root_pass | length >= 16
    fail_msg: >-
      Faltan sourcebans_db_pass y/o sourcebans_db_root_pass en group_vars/all.yml
      (gitignorado). Genéralas con `openssl rand -base64 24`. No hay valor por defecto a
      propósito: una contraseña de ejemplo en un repo público acaba en producción.

# El panel se publica en zip y Ubuntu Server no trae unzip de serie. Sin esto la tarea de
# descomprimir falla con un mensaje que culpa al archivo, no a la herramienta que falta.
- name: Install unzip
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the sourcebans directory
  ansible.builtin.file:
    path: "{{ sourcebans_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Check whether the web panel is already unpacked
  ansible.builtin.stat:
    path: "{{ sourcebans_dir }}/panel/index.php"
  register: panel_presente

# Se descarga el paquete ya construido de la release, no el repositorio: el zip
# `webpanel-only` trae las dependencias de composer resueltas, así que la imagen no necesita
# ni composer ni node.
- name: Download the SourceBans++ web panel
  ansible.builtin.get_url:
    url: >-
      https://github.com/sbpp/sourcebans-pp/releases/download/{{ sourcebans_version }}/sourcebans-pp-{{ sourcebans_version }}.webpanel-only.zip
    dest: "{{ sourcebans_dir }}/panel.zip"
    mode: "0640"
  when: not panel_presente.stat.exists

- name: Unpack the web panel
  ansible.builtin.unarchive:
    src: "{{ sourcebans_dir }}/panel.zip"
    dest: "{{ sourcebans_dir }}"
    remote_src: true
    creates: "{{ sourcebans_dir }}/panel"
  when: not panel_presente.stat.exists
  notify: reiniciar sourcebans

# El zip descomprime en un nombre que cambia entre versiones; se normaliza a `panel/` para
# que el Dockerfile no tenga que saberlo.
- name: Normalise the unpacked directory name
  ansible.builtin.shell: |
    set -e
    cd "{{ sourcebans_dir }}"
    if [ ! -d panel ]; then
      d=$(find . -maxdepth 1 -type d -name 'sourcebans*' | head -1)
      [ -n "$d" ] && mv "$d" panel
    fi
  args:
    creates: "{{ sourcebans_dir }}/panel"

# Todo lo del certificado va ANTES de renderizar la compose: es la compose la que cambia
# de forma según haya certificado o no, y decidirlo después dejaba el fichero describiendo
# un modo público que no podía arrancar.

# La emisión inicial es aparte de la renovación: certbot necesita que nginx ya esté
# sirviendo el reto en el puerto 80, y nginx no arranca sin certificado. Se rompe el círculo
# pidiendo primero un certificado en modo standalone, con el proxy aún parado.
- name: Check whether the certificate already exists
  ansible.builtin.command:
    cmd: >-
      docker run --rm -v sourcebans_certs:/c alpine
      test -f /c/live/{{ sourcebans_hostname }}/fullchain.pem
  register: cert_previo
  failed_when: false
  changed_when: false
  when: sourcebans_publico | bool

- name: Issue the first certificate
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      -e AWS_ACCESS_KEY_ID={{ sourcebans_aws_key_id }}
      -e AWS_SECRET_ACCESS_KEY={{ sourcebans_aws_secret }}
      -v sourcebans_certs:/etc/letsencrypt
      certbot/dns-route53 certonly --dns-route53 --non-interactive --agree-tos
      --email {{ sourcebans_email }}
      -d {{ sourcebans_hostname }}
    chdir: "{{ sourcebans_dir }}"
  when:
    - sourcebans_publico | bool
    - cert_previo.rc | default(1) != 0
  register: emision
  # No aborta nunca. La causa habitual es que el router no reenvíe el puerto 80, y eso no
  # se arregla desde aquí: el panel sigue sirviendo en la LAN y el playbook debe terminar
  # dejando el resto en pie en vez de abandonar a medias.
  failed_when: false
  changed_when: emision.rc == 0

- name: Warn when the certificate could not be issued
  ansible.builtin.debug:
    msg: >-
      No se pudo emitir el certificado para {{ sourcebans_hostname }}. Se valida por DNS en
      Route53, así que no hacen falta puertos: revisa que sourcebans_aws_key_id y
      sourcebans_aws_secret estén puestos y que la credencial siga viva. Mientras tanto el
      panel sigue disponible en la LAN.
  when:
    - sourcebans_publico | bool
    - emision is defined
    - emision.rc | default(0) != 0

- name: Check whether the certificate exists after issuing
  ansible.builtin.command:
    cmd: >-
      docker run --rm -v sourcebans_certs:/c alpine
      test -f /c/live/{{ sourcebans_hostname }}/fullchain.pem
  register: cert_final
  failed_when: false
  changed_when: false
  when: sourcebans_publico | bool

# nginx no arranca sin certificado, así que sin él no tiene sentido esperar por HTTPS.
- name: Fall back to the LAN check when there is no certificate
  ansible.builtin.set_fact:
    sourcebans_publico: false
  when:
    - sourcebans_publico | bool
    - cert_final.rc | default(1) != 0

# El asistente escribe config.php dentro del contenedor. Se rescata al host para poder
# montarlo, y a partir de ahí ya vive fuera. Se hace ANTES de rescribir la compose porque
# es su existencia la que decide si hay montaje.
- name: Rescue config.php from the container if it only lives there
  ansible.builtin.shell: |
    set -e
    if [ ! -f "{{ sourcebans_dir }}/config.php" ] \
       && docker exec sourcebans-web test -f /var/www/html/config.php 2>/dev/null; then
      docker cp sourcebans-web:/var/www/html/config.php "{{ sourcebans_dir }}/config.php"
      chmod 640 "{{ sourcebans_dir }}/config.php"
      echo rescatado
    fi
  register: rescate
  changed_when: "'rescatado' in rescate.stdout"
  failed_when: false

- name: Check whether the panel is already installed
  ansible.builtin.stat:
    path: "{{ sourcebans_dir }}/config.php"
  register: config_php

- name: Remember whether there is a configuration to mount
  ansible.builtin.set_fact:
    config_presente: "{{ config_php.stat.exists }}"

- name: Write the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ sourcebans_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: reiniciar sourcebans

- name: Write the proxy configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ sourcebans_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  when: sourcebans_publico | bool
  notify: reiniciar sourcebans

- name: Write the image definition
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ sourcebans_dir }}/Dockerfile"
    owner: root
    group: root
    mode: "0640"
  notify: reiniciar sourcebans

# 0600 y de root: lleva las contraseñas de la base. Va en un .env aparte y no dentro de la
# compose para que el fichero que sí se puede leer no las contenga.
- name: Write the database credentials
  ansible.builtin.copy:
    content: |
      DB_PASS={{ sourcebans_db_pass }}
      DB_ROOT_PASS={{ sourcebans_db_root_pass }}
      AWS_KEY_ID={{ sourcebans_aws_key_id }}
      AWS_SECRET={{ sourcebans_aws_secret }}
    dest: "{{ sourcebans_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: reiniciar sourcebans

- name: Bring the stack up
  ansible.builtin.command:
    # --remove-orphans: al caer a modo LAN, la compose deja de declarar el proxy y
    # certbot. Sin esto se quedan corriendo —el proxy en bucle de reinicio, porque no
    # hay certificado— y ocupan los puertos 80 y 443 de la máquina.
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ sourcebans_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"

- name: Wait for the panel to answer
  ansible.builtin.uri:
    # Contra el propio proxy, no contra el nombre público: ahí no hay ni DNS ni secreto de
    # origen de por medio, así que esto comprueba el servicio y no la red que lo rodea.
    url: >-
      {{ 'https://127.0.0.1:' ~ sourcebans_https_port ~ '/health' if sourcebans_publico | bool
         else 'http://' ~ sourcebans_bind ~ ':' ~ sourcebans_web_port ~ '/' }}
    validate_certs: false
    status_code: [200, 302, 301]
  register: panel_vivo
  retries: 30
  delay: 5
  until: panel_vivo is succeeded

# El panel es una aplicación distinta de la web, con su propia cabecera, así que desde
# dentro no hay ninguna manera de volver. Se cuela un enlace junto al botón de tema, que es
# el último elemento de esa cabecera y por tanto el sitio donde cae a su derecha.
# Se parchea la plantilla en el host porque el Dockerfile la copia a la imagen: editarla
# dentro del contenedor se perdería en la siguiente reconstrucción.
# Va como `secondary` y no como `ghost` —el estilo del botón de tema— porque ghost es
# invisible hasta que pasas por encima, y la salida tiene que verse sin buscarla.
- name: Give the panel a way back to the site
  ansible.builtin.blockinfile:
    path: "{{ sourcebans_dir }}/panel/themes/default/core/title.tpl"
    # Comentario de Smarty, no de HTML: así los marcadores no llegan al navegador.
    marker: '        {{ "{*" }} {mark} vuelta al sitio (gestionado por Ansible) {{ "*}" }}'
    insertbefore: '^\s*</header>'
    block: |2
              <a href="{{ sourcebans_site_url }}"
                 class="btn btn--secondary"
                 data-testid="volver-al-sitio">
                  <span>Volver al listado de servidores</span>
              </a>
  notify: reiniciar sourcebans

# --- el lado del juego -------------------------------------------------------------

# El tarball envuelve todo en `<nombre-release>/common/`, así que hay que descartar dos
# niveles para que `addons/` caiga donde el juego lo busca. Sin esto se queda un directorio
# suelto dentro de left4dead2/ y SourceMod no ve ningún plugin.
- name: Install the SourceBans++ game plugins
  ansible.builtin.unarchive:
    src: >-
      https://github.com/sbpp/sourcebans-pp/releases/download/{{ sourcebans_version }}/sourcebans-pp-{{ sourcebans_version }}.plugin-only.tar.gz
    dest: "{{ install_dir }}/left4dead2"
    remote_src: true
    extra_opts: ["--strip-components=2"]
    owner: "{{ steam_user }}"
    group: "{{ steam_user }}"
    creates: "{{ install_dir }}/left4dead2/addons/sourcemod/plugins/sbpp_main.smx"

- name: Remove the leftover wrapper directory from an earlier attempt
  ansible.builtin.file:
    path: "{{ install_dir }}/left4dead2/sourcebans-pp-{{ sourcebans_version }}.plugin-only"
    state: absent

# SourceMod lee las conexiones de aquí. El servidor de juego corre en el host, así que
# alcanza la base por el puerto que la compose publica en loopback.
- name: Point SourceMod at the bans database
  ansible.builtin.blockinfile:
    path: "{{ install_dir }}/left4dead2/addons/sourcemod/configs/databases.cfg"
    marker: '    // {mark} sourcebans (gestionado por Ansible)'
    insertbefore: '^\}'
    block: |2
          "sourcebans"
          {
              "driver"    "mysql"
              "host"      "127.0.0.1"
              "database"  "{{ sourcebans_db_name }}"
              "user"      "{{ sourcebans_db_user }}"
              "pass"      "{{ sourcebans_db_pass }}"
              "port"      "{{ sourcebans_db_port }}"
          }
    owner: "{{ steam_user }}"
    group: "{{ steam_user }}"
    mode: "0640"

# El paquete deja sourcebans.cfg en configs/sourcebans/, pero sbpp_main lo busca un nivel
# más arriba, en configs/. Lo dice él mismo al arrancar: "Loading configs/sourcebans.cfg".
# Sin ese fichero arranca igual, sin quejarse, solo que con los valores por defecto.
# Se copia en vez de plantillarlo para no quedarnos atrás cuando cambien las opciones
# aguas arriba, y con force: false para que un retoque a mano sobreviva al despliegue.
- name: Give the bans plugin the config file it actually reads
  ansible.builtin.copy:
    src: "{{ install_dir }}/left4dead2/addons/sourcemod/configs/sourcebans/sourcebans.cfg"
    dest: "{{ install_dir }}/left4dead2/addons/sourcemod/configs/sourcebans.cfg"
    remote_src: true
    force: false
    owner: "{{ steam_user }}"
    group: "{{ steam_user }}"
    mode: "0644"

# Es la dirección que el plugin enseña en el mensaje de expulsión, para que quien reciba un
# baneo sepa dónde apelarlo. Por defecto viene un dominio de ejemplo que no lleva a nada.
- name: Send banned players to our panel
  ansible.builtin.lineinfile:
    path: "{{ install_dir }}/left4dead2/addons/sourcemod/configs/sourcebans.cfg"
    regexp: '^\s*"Website"'
    line: "\t\t\"Website\"\t\t\t\"{{ sourcebans_panel_url }}\""
    owner: "{{ steam_user }}"
    group: "{{ steam_user }}"

# El instalador no crea ningún grupo de permisos, y sin grupo un admin del panel no tiene
# nada: ni banear. Se crea el del operador con la `z` de root. Solo rige DENTRO del panel;
# el mando en el juego sale de admins_simple.ini, que es otra cosa y no depende de la base.
- name: Give the panel a group with full rights
  ansible.builtin.command:
    cmd: >-
      docker exec sourcebans-db mariadb -u{{ sourcebans_db_user }} -p{{ sourcebans_db_pass }}
      {{ sourcebans_db_name }} -e
      "INSERT INTO sb_srvgroups (flags, immunity, name, groups_immune)
       SELECT 'z', 100, '{{ sourcebans_grupo_operador }}', '' FROM DUAL
       WHERE NOT EXISTS (SELECT 1 FROM sb_srvgroups WHERE name = '{{ sourcebans_grupo_operador }}');
       UPDATE sb_admins SET srv_group = '{{ sourcebans_grupo_operador }}', immunity = 100
       WHERE srv_group IS NULL OR srv_group = '';"
  changed_when: false
  when: config_presente | bool

# El panel abre con un texto de bienvenida que trae puesto el instalador y que habla de la
# instalación en vez de para qué sirve la página. Se queda ahí para siempre si nadie lo
# cambia, y es lo primero que ve quien llega buscando su baneo.
- name: Say what the panel is for, instead of that it got installed
  ansible.builtin.command:
    cmd: >-
      docker exec sourcebans-db mariadb -u{{ sourcebans_db_user }} -p{{ sourcebans_db_pass }}
      {{ sourcebans_db_name }} -e
      "UPDATE sb_settings SET value = '{{ sourcebans_intro_titulo | replace("'", "''") }}'
         WHERE setting = 'dash.intro.title';
       UPDATE sb_settings SET value = '{{ sourcebans_intro_texto | replace("'", "''") }}'
         WHERE setting = 'dash.intro.text';"
  changed_when: false
  when: config_presente | bool

# SourceBans no descubre los servidores solo: hay que darlos de alta, y cada baneo guarda
# el sid del servidor donde se puso. Si el servidor no está en la tabla el sid sale nulo y
# el INSERT del baneo se cae entero.
#
# La IP aquí es puramente lo que se enseña en el panel: quién es cada servidor se decide
# con `sb_id`, que l4d2-run.sh escribe en la cfg de cada instancia. Sin ese id el plugin se
# buscaría por el cvar `hostip` —que aquí vale 127.0.1.1, la que Ubuntu pone en /etc/hosts—
# y habría que publicar esa dirección para que se encontrara. Con el id explícito se puede
# poner la pública, que además es la que sirve para conectarse.
- name: Register the game servers in the bans panel
  ansible.builtin.command:
    cmd: >-
      docker exec sourcebans-db mariadb -u{{ sourcebans_db_user }} -p{{ sourcebans_db_pass }}
      {{ sourcebans_db_name }} -e
      "INSERT INTO sb_servers (sid, ip, port, rcon, modid, enabled)
       SELECT {{ item }}, '{{ sourcebans_ip_publica }}', {{ port_base + item }},
              '{{ rcon_password }}', 16, 1 FROM DUAL
       WHERE NOT EXISTS (SELECT 1 FROM sb_servers WHERE sid = {{ item }});"
  loop: "{{ range(1, server_count + 1) | list }}"
  changed_when: false
  when: config_presente | bool

# Sin esto los baneos dejan de funcionar en cuanto alguien escribe !match — que es
# justamente cuando hacen falta. confogl descarga TODO al entrar en matchmode y solo recarga
# lo que sus cfg piden; ver roles/l4d2_fleet/files/fleet_plugins.cfg.
# basebans es el plugin de baneos que trae SourceMod y guarda en banned_user.cfg. Registra
# sm_ban / sm_addban / sm_unban, y como se carga antes, se queda los comandos: el baneo
# parece funcionar —responde "Ban has been added"— pero no llega nunca a la base. Se aparta
# a disabled/ en vez de borrarlo, para poder revertir sin reinstalar SourceMod.
- name: Make room for the SourceBans commands
  ansible.builtin.command:
    cmd: >-
      mv {{ install_dir }}/left4dead2/addons/sourcemod/plugins/basebans.smx
         {{ install_dir }}/left4dead2/addons/sourcemod/plugins/disabled/basebans.smx
    creates: "{{ install_dir }}/left4dead2/addons/sourcemod/plugins/disabled/basebans.smx"
    removes: "{{ install_dir }}/left4dead2/addons/sourcemod/plugins/basebans.smx"
  become: true
  become_user: "{{ steam_user }}"

- name: Keep the bans plugins loaded during a match
  ansible.builtin.lineinfile:
    path: "{{ install_dir }}/left4dead2/cfg/cfgogl/fleet_plugins.cfg"
    line: "sm plugins load {{ item }}"
    insertafter: EOF
    owner: "{{ steam_user }}"
    group: "{{ steam_user }}"
  loop:
    # sbpp_main aplica los baneos; sbpp_checker comprueba a quien entra contra la base.
    # Son los dos que tienen que seguir vivos durante una partida competitiva.
    - sbpp_main.smx
    - sbpp_checker.smx

# Con el panel ya instalado, el asistente y el actualizador sobran, y el propio panel se
# niega a arrancar mientras sigan ahí: los dos pueden lanzar migraciones contra la base en
# producción y quedan al alcance de cualquiera que dé con la URL.
- name: Remove the installer and updater once the panel is configured
  ansible.builtin.file:
    path: "{{ sourcebans_dir }}/panel/{{ item }}"
    state: absent
  loop: [install, updater]
  when: config_presente | bool
  notify: reiniciar sourcebans
