---
# SourceBans++ va en contenedores y no sobre el host. Dos razones: esta máquina ya usa
# Docker para otro proyecto, y el panel necesita PHP con extensiones que no queremos
# instalar al lado de un servidor de juego.
sourcebans_dir: /opt/sourcebans
sourcebans_version: "2.0.2"

# Puertos, solo en loopback por defecto. El panel tiene su propio login, pero exponerlo a
# la red es una decisión aparte y explícita: ver `sourcebans_bind`.
sourcebans_bind: "127.0.0.1"
sourcebans_web_port: 8081
sourcebans_db_port: 3308

sourcebans_db_name: sourcebans
sourcebans_db_user: sourcebans
# Sin valor por defecto A PROPÓSITO: una contraseña de ejemplo en un repo público acaba en
# producción. Se genera al desplegar y se guarda en el .env del host.
sourcebans_db_pass: ""
sourcebans_db_root_pass: ""

# La imagen de MariaDB se fija por versión: un `latest` convierte cualquier despliegue
# futuro en una migración de base de datos no planeada.
sourcebans_mariadb_image: "mariadb:10.11"

# Nombre público del panel. El navegador habla TLS directamente contra esta máquina, sin
# pasar por CloudFront: el salto CloudFront→casa iría por internet llevando la contraseña
# del panel, y no compensa. Ver infra/lambdas/api/sourcebans.ts.
sourcebans_hostname: "sb.ventrax.dev"
# La que se le enseña a quien recibe un baneo para que sepa dónde apelarlo. Es la del sitio
# público, no la de arriba: esa es interna y además va con un puerto raro.
sourcebans_panel_url: "https://l4d2.ventrax.dev/sourcebans/"
# La raíz del sitio. El panel es una aplicación aparte y sin esto no hay forma de volver:
# quien entra desde la cabecera se queda ahí encallado salvo que edite la barra.
sourcebans_site_url: "https://l4d2.ventrax.dev/"
# La que se muestra en la lista de servidores del panel. Es solo presentación —el servidor
# se identifica con sb_id— así que aquí va la que le sirve a la gente para conectarse.
sourcebans_ip_publica: "38.253.185.38"
# Para avisos de caducidad del certificado.
sourcebans_email: ""
# Con false se queda solo en la LAN y no se pide certificado. Útil para probar sin depender
# de que el router tenga el puerto 80 abierto.
sourcebans_publico: false

# Puerto en el que la máquina sirve el panel por HTTPS. NO tiene por qué ser 443: con
# CloudFront delante nadie lo escribe nunca, así que vale cualquiera que el router reenvíe.
sourcebans_https_port: 8443

# Credenciales de Route53 para renovar el certificado por DNS. Se valida por DNS y no por
# HTTP porque el puerto 80 de esta máquina está asignado a otro equipo de la red: sin él,
# HTTP-01 no funciona nunca, no es cuestión de insistir. El permiso está recortado al
# registro de validación de este subdominio (ver infra/lib/constructs/certbot.ts).
sourcebans_aws_key_id: ""
sourcebans_aws_secret: ""

# El mismo secreto que CloudFront manda a las Lambdas. Sin él, cualquiera que diera con el
# puerto entraría al panel saltándose el CDN.
sourcebans_origen_secreto: ""
