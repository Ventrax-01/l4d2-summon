// Managed by Ansible. Do not edit by hand.
//
// Plugins that must stay loaded during a competitive match.
//
// confogl's matchmode transition (`!match` → sm_forcematch <config>) does
// `load_unlock` → `unload_all` → load whatever its cfgs ask for → `load_lock`.
// Anything not requested in that window is gone, and the lock then makes it
// impossible to load afterwards. So asking for them here is not a hack: it is the
// only sanctioned point at which a plugin can join the matchmode set.
//
// The patched predictable_unloader covers a DIFFERENT path (`pred_unload_plugins`).
// Both are needed; neither replaces the other.
sm plugins load chat_logger.smx
sm plugins load admin_manager.smx
sm plugins load idle_hibernate.smx
